apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: ${ENV}
data:
  FLASK_DEBUG: "0"
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_SCHEMA: "${ENV}"
  DD_LOGS_INJECTION: "true"
  AWS_DEFAULT_REGION: "${AWS_REGION}"
  FILA_EVENTOS: "oficina-${ENV}-os-eventos.fifo"
  FILA_BILLING: "oficina-${ENV}-billing-comandos.fifo"
  FILA_EXECUCAO: "oficina-${ENV}-execucao-comandos.fifo"
