services:
  db:
    image: postgres:16
    container_name: oficina_db
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-oficina:
    build: .
    container_name: oficina_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DD_TRACE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
