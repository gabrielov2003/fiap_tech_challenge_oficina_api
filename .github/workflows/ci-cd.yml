name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oficina-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -r requirements.txt

      - run: python -m pytest tests/unit_tests.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
          if ! kubectl cluster-info > /dev/null 2>&1; then
            echo "Cluster inacessível — etapa de deploy ignorada."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - name: Apply K8s manifests
        if: env.SKIP_DEPLOY != 'true'
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          envsubst < k8s/secret.yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml -f k8s/pvc.yaml -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/hpa.yaml

      - name: Update image and rollout
        if: env.SKIP_DEPLOY != 'true'
        run: |
          kubectl set image deployment/oficina-api oficina-api=${{ env.IMAGE }}:${{ github.sha }}
          kubectl rollout status deployment/oficina-api --timeout=120s
